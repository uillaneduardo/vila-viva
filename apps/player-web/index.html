<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vila Viva · Jogador</title>
<link rel="stylesheet" href="/apps/shared-ui/style.css"></head>
<body data-role="player">
<canvas id="game" tabindex="0" aria-label="Mapa interativo da simulação"></canvas>
<div id="interface">
 <header class="brand glass"><span class="logo">✳</span><span><strong id="worldName">Vila Viva</strong><small>JOGADOR · MUNDO</small></span></header>
 <div class="top-center">
  <div class="top-group glass"><div class="time"><strong id="day">Dia —</strong><small id="clockTime">—:—</small></div><span class="divider"></span>
   <button id="speed0" class="time-btn" title="Pausar/retomar (&#39;)" aria-label="Pausar ou retomar">⏸</button>
   <button id="speed1" class="time-btn" title="Velocidade 1× (1)">1×</button>
   <button id="speed2" class="time-btn" title="Velocidade 2× (2)">2×</button>
   <button id="speed4" class="time-btn" title="Velocidade 4× (3)">4×</button>
  </div>
  <div class="top-group glass resources"><span class="upper-label">DEPÓSITO</span>
   <span class="resource"><b class="resource-icon wood">♣</b><strong id="woodCount">—</strong></span>
   <span class="resource"><b class="resource-icon food">●</b><strong id="foodCount">—</strong></span>
   <span class="resource"><b class="resource-icon stone">◆</b><strong id="stoneCount">—</strong></span>
  </div>
 </div>
 <div class="top-right"><span class="glass badge"><i class="status-dot"></i><span id="connection">Conectando…</span></span><span class="glass badge" id="population">— habitantes</span></div>
 <span class="glass tool-badge" id="toolBadge">Modo observar</span>
 <nav id="dock" class="dock glass" aria-label="Ferramentas do Modo Deus"></nav>
 <div id="godActionStack" class="god-action-stack">
  <div id="brushPanel" class="brush glass" hidden>
   <strong id="brushName">Pincel</strong>
   <button id="brushMinus" title="Diminuir pincel">−</button><output id="brushValue">1 × 1</output><button id="brushPlus" title="Aumentar pincel">+</button>
   <input id="brushSize" type="range" min="1" max="15" value="1" step="1" aria-label="Tamanho do pincel" hidden>
   <button id="brushShape" type="button" aria-label="Formato do pincel: quadrado" title="Alternar formato do pincel" aria-pressed="false">□</button>
   <span id="brushCount" class="brush-count" aria-live="polite">1 célula</span>
  </div>
  <section id="godSubmenu" class="god-submenu glass" hidden aria-label="Submenu de opções do Modo Deus">
   <div class="god-submenu-section">
    <span class="god-submenu-caption" id="godSubmenuLabel">Tipo</span>
    <div id="godSubmenuChoices" class="god-submenu-tiles" role="group" aria-label="Tipo de elemento"></div>
   </div>
   <div id="godBuildModes" class="god-submenu-section god-submenu-modes" hidden>
    <span class="god-submenu-caption">Estado inicial</span>
    <div id="godBuildModeChoices" class="god-submenu-tiles" role="group" aria-label="Fase da construção"></div>
   </div>
  </section>
 </div>
 <section id="panel" class="context glass" hidden aria-label="Inspetor contextual">
  <header class="context-head"><div class="portrait" id="portrait">A</div><div class="head-label"><strong id="panelName">Entidade</strong><small id="panelDesc"></small></div>
   <button id="follow" title="Seguir entidade"></button><button id="collapse" title="Recolher painel" aria-label="Recolher painel"></button>
  </header>
  <div class="context-main"><nav id="panelNav" class="context-nav" aria-label="Seções da entidade"></nav><div id="panelScroll" class="context-scroll"><div id="panelBody" class="context-body"></div></div></div>
 </section>
 <button id="expand" class="expand glass" hidden aria-label="Expandir painel contextual" title="Expandir painel"></button>
 <div id="tooltip" class="tooltip glass" hidden><strong id="tooltipName"></strong><small id="tooltipHealth"></small><small id="tooltipActivity"></small><small id="tooltipRoute"></small></div>
 <div class="glass bottom-note" id="introHint"></div>
 <div class="glass bottom-left"><b>Mouse</b> selecionar / arrastar　<b>WASD</b> câmera　<b>Roda</b> zoom</div>
 <div class="glass bottom-right">Zoom <span id="zoom">100%</span> · <span id="coordinates">x: — · y: —</span></div>
 <div class="status glass" role="status" aria-live="polite" id="statusMessage"></div>
 <div class="world-tick glass" id="worldTick">Tick —</div>
</div>
<script type="module" src="/apps/shared-ui/app.js"></script>
</body></html>
