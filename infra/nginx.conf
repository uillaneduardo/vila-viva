server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  location = /healthz { access_log off; add_header Content-Type text/plain; return 200 'ok'; }
  location /api/ {
    resolver 127.0.0.11 ipv6=off valid=10s;
    set $simulation_api "api:3000";
    proxy_pass http://$simulation_api;
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;
    add_header Cache-Control "no-store" always;
  }
  location = /index.html {
    add_header Cache-Control "no-store, max-age=0" always;
    try_files $uri =404;
  }
  location ~ ^/(lab|app|remote|godview)\.js$ {
    default_type application/javascript;
    add_header Cache-Control "no-store, max-age=0, must-revalidate" always;
    try_files $uri =404;
  }
  location = /version.txt {
    add_header Cache-Control "no-store, max-age=0" always;
    default_type text/plain;
    try_files $uri =404;
  }
  location / { try_files $uri $uri/ /index.html; }
}
