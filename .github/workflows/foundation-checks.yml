name: Gameplay foundation
on:
  push:
    branches: [architecture/gameplay-first]
  pull_request:
    paths: ['packages/**', 'tests/**', '.github/workflows/foundation-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - run: node --experimental-strip-types --test tests/*.test.mts
