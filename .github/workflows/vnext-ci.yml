name: Oturo vNext CI and homelab2 deploy
on:
  push:
    branches: [main, migration/vnext-root-legacy-archive, architecture/gameplay-first]
  pull_request:
    branches: [main, integration]
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Opcional: SHA exato da main (vazio usa HEAD ao disparar)"
        required: false
        type: string
permissions:
  contents: read
jobs:
  validate:
    permissions:
      contents: read
    uses: ./.github/workflows/vnext-validation.yml
    with:
      validation_ref: ${{ github.sha }}
  release_gate:
    needs: [validate]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      current: ${{ steps.latest.outputs.current }}
    steps:
      - name: Direct pushes wait for a quiet five-minute window
        if: github.event_name == 'push'
        run: sleep 300
      - name: Verify current main revision
        id: latest
        uses: actions/github-script@v7
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        with:
          script: |
            const main=await github.rest.repos.getBranch({...context.repo,branch:'main'});
            const current=main.data.commit.sha===context.sha && (!process.env.EXPECTED_SHA || process.env.EXPECTED_SHA===context.sha);
            core.setOutput('current',String(current));
            if(!current)core.notice('Superseded release: no image publication or deployment.');
  publish:
    needs: [release_gate]
    if: needs.release_gate.outputs.current == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            SOURCE_SHA=${{ github.sha }}
          tags: ghcr.io/uillaneduardo/vila-viva:vnext-sha-${{ github.sha }}
  deploy_homelab2:
    needs: [release_gate, publish]
    if: needs.release_gate.outputs.current == 'true'
    runs-on: [self-hosted, linux, x64, vila-viva-svr2]
    timeout-minutes: 20
    concurrency:
      group: oturo-vnext-homelab2
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify release SHA still is main HEAD
        id: latest
        uses: actions/github-script@v7
        with:
          script: |
            const main=await github.rest.repos.getBranch({owner:context.repo.owner,repo:context.repo.repo,branch:'main'});
            core.setOutput('current', String(main.data.commit.sha===context.sha));
      - name: Deploy validated vNext and verify local endpoint
        if: steps.latest.outputs.current == 'true'
        env:
          DEPLOY_SHA: ${{ github.sha }}
          DEPLOY_IMAGE_TAG: vnext-sha-${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: bash infra/deploy-vnext.sh
  notify_release:
    needs: [validate, release_gate, publish, deploy_homelab2]
    if: always() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (needs.validate.result == 'failure' || needs.release_gate.result == 'failure' || needs.publish.result == 'failure' || needs.deploy_homelab2.result == 'failure' || needs.deploy_homelab2.result == 'success')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Notify Telegram (optional configured secrets)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MESSAGE: "Oturo | SHA ${{ github.sha }} | validação=${{ needs.validate.result }} | publicação=${{ needs.publish.result }} | deploy=${{ needs.deploy_homelab2.result }} | ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: bash infra/notify-telegram.sh
