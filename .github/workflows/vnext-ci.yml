name: Oturo vNext CI and homelab2 deploy
on:
  push:
    branches: [main, migration/vnext-root-legacy-archive, architecture/gameplay-first]
  pull_request:
    branches: [main, integration]
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Opcional: SHA exato da main (vazio usa HEAD ao disparar)"
        required: false
        type: string
  workflow_call:
    inputs:
      validation_ref:
        required: true
        type: string
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.validation_ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - name: Install runtime dependencies
        run: npm install --no-package-lock --ignore-scripts
      - name: Run domain, effects, localization, renderer and API tests
        run: node --experimental-strip-types --test tests/*.test.mts
      - name: Measure deterministic community baseline (15000 ticks)
        run: node --experimental-strip-types scripts/measure-community.mts oturo-starter-v1 15000
      - name: Measure additional deterministic community seeds
        run: |
          for seed in oturo-stability-a oturo-stability-b; do
            node --experimental-strip-types scripts/measure-community.mts "$seed" 15000
          done
      - name: Ensure archived deployment and new deployment contracts coexist
        run: |
          test -s .old/Dockerfile
          test -s .old/compose.yml
          test -s .old/.github/workflows/deploy.yml
          test -s Dockerfile
          test -s compose.yml
          test -s infra/deploy-vnext.sh
          bash -n infra/deploy-vnext.sh
          IMAGE_TAG=vnext-ci SOURCE_SHA=unknown docker compose -f compose.yml config --quiet
      - name: Verify browser JavaScript syntax
        run: |
          node --check apps/shared-ui/app.js
          node --check packages/i18n/src/index.js
          for source in packages/protocol/src/*.js packages/client-sdk/src/*.js packages/renderer/src/*.js packages/ui/src/*.js packages/ui/assets/*.js packages/ui/assets/icons/*.js packages/ui/assets/themes/*.js; do
            node --check "$source"
          done
  image_smoke:
    needs: foundation
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.validation_ref || github.sha }}
          persist-credentials: false
      - name: Build vNext image and validate HTTP/visual endpoints
        run: |
          set -euo pipefail
          validated_sha="$(git rev-parse HEAD)"
          docker build --build-arg SOURCE_SHA="$validated_sha" -t oturo-vnext-ci .
          docker run -d --name oturo-vnext-ci -p 127.0.0.1:18586:8086 oturo-vnext-ci
          trap 'docker rm -f oturo-vnext-ci >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:18586/healthz >/dev/null && break || sleep 2
          done
          test "$(curl -fsS http://127.0.0.1:18586/version.txt | tr -d '\r\n')" = "$validated_sha"
          curl -fsS http://127.0.0.1:18586/admin | grep -F ADMINISTRADOR >/dev/null
          curl -fsS http://127.0.0.1:18586/browser | grep -F ADMINISTRADOR >/dev/null
          curl -fsS http://127.0.0.1:18586/apps/browser-runtime/worker.js -o /tmp/browser-worker.js
          test -s /tmp/browser-worker.js
          curl -fsS http://127.0.0.1:18586/apps/player-web/assets-preview.html | grep -F Oturo >/dev/null
          curl -fsS http://127.0.0.1:18586/api/world | grep -F '"world"' >/dev/null
          curl -fsS http://127.0.0.1:18586/assets/world/vegetation/apple_tree_atlas_96.png -o /tmp/oturo-apple-atlas.png
          python3 - <<'PY'
          from pathlib import Path
          assert Path('/tmp/oturo-apple-atlas.png').read_bytes().startswith(b'\x89PNG\r\n\x1a\n')
          PY
          # Exercise Docker named-volume ownership and paused restore across process restart.
          docker volume create oturo-ci-persist >/dev/null
          docker run -d --name oturo-ci-persist -p 127.0.0.1:18587:8086 \
            -e OTURO_DATA_DIR=/opt/oturo/data -e OTURO_WORLD_SEED=oturo-starter-v1 \
            -v oturo-ci-persist:/opt/oturo/data oturo-vnext-ci
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:18587/healthz >/dev/null && break || sleep 2
          done
          curl -fsS http://127.0.0.1:18587/api/world | python3 -c \
            'import sys,json; d=json.load(sys.stdin); assert d["persistent"] and d["clock"]["paused"]; assert d["world"]["seed"]=="oturo-starter-v1"; assert any(e.get("communityRole")=="leader" for e in d["world"]["entities"])'
          curl -fsS -H 'Content-Type: application/json' \
            -X POST -d '{"role":"admin","name":"before-restart"}' \
            http://127.0.0.1:18587/api/world/save | python3 -c \
            'import sys,json; assert json.load(sys.stdin)["name"]=="before-restart"'
          docker restart oturo-ci-persist >/dev/null
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:18587/healthz >/dev/null && break || sleep 2
          done
          curl -fsS http://127.0.0.1:18587/api/world | python3 -c \
            'import sys,json; d=json.load(sys.stdin); assert d["persistent"] and d["clock"]["paused"]; assert d["world"]["seed"]=="oturo-starter-v1"'
          curl -fsS http://127.0.0.1:18587/api/world/saves | python3 -c \
            'import sys,json; assert any(s["name"]=="before-restart" for s in json.load(sys.stdin)["saves"])'
          docker rm -f oturo-ci-persist >/dev/null
          docker volume rm oturo-ci-persist >/dev/null
  release_gate:
    needs: [foundation, image_smoke]
    if: inputs.validation_ref == '' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      current: ${{ steps.latest.outputs.current }}
    steps:
      - name: Direct pushes wait for a quiet five-minute window
        if: github.event_name == 'push'
        run: sleep 300
      - name: Verify current main revision
        id: latest
        uses: actions/github-script@v7
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        with:
          script: |
            const main=await github.rest.repos.getBranch({...context.repo,branch:'main'});
            const current=main.data.commit.sha===context.sha && (!process.env.EXPECTED_SHA || process.env.EXPECTED_SHA===context.sha);
            core.setOutput('current',String(current));
            if(!current)core.notice('Superseded release: no image publication or deployment.');
  publish:
    needs: [release_gate]
    if: needs.release_gate.outputs.current == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            SOURCE_SHA=${{ github.sha }}
          tags: ghcr.io/uillaneduardo/vila-viva:vnext-sha-${{ github.sha }}
  deploy_homelab2:
    needs: [release_gate, publish]
    if: needs.release_gate.outputs.current == 'true'
    runs-on: [self-hosted, linux, x64, vila-viva-svr2]
    timeout-minutes: 20
    concurrency:
      group: oturo-vnext-homelab2
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify release SHA still is main HEAD
        id: latest
        uses: actions/github-script@v7
        with:
          script: |
            const main=await github.rest.repos.getBranch({owner:context.repo.owner,repo:context.repo.repo,branch:'main'});
            core.setOutput('current', String(main.data.commit.sha===context.sha));
      - name: Deploy validated vNext and verify local endpoint
        if: steps.latest.outputs.current == 'true'
        env:
          DEPLOY_SHA: ${{ github.sha }}
          DEPLOY_IMAGE_TAG: vnext-sha-${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: bash infra/deploy-vnext.sh
  notify_release:
    needs: [foundation, image_smoke, release_gate, publish, deploy_homelab2]
    if: always() && inputs.validation_ref == '' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (needs.foundation.result == 'failure' || needs.image_smoke.result == 'failure' || needs.release_gate.result == 'failure' || needs.publish.result == 'failure' || needs.deploy_homelab2.result == 'failure' || needs.deploy_homelab2.result == 'success')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Notify Telegram (optional configured secrets)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MESSAGE: "Oturo | SHA ${{ github.sha }} | testes=${{ needs.foundation.result }} | imagem=${{ needs.image_smoke.result }} | publicação=${{ needs.publish.result }} | deploy=${{ needs.deploy_homelab2.result }} | ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: bash infra/notify-telegram.sh
