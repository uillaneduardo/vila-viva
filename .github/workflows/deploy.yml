name: CI and homelab2 deploy
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate prototype structure and scripts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path("index.html").read_text()
          js = Path("app.js").read_text()
          assert "<canvas" in html
          assert 'src="./app.js"' in html
          assert "function tick(w)" in js
          assert "function event(w,type" in js
          assert "localStorage" in js
          assert 'src="./lab.js"' in html
          assert Path("lab.js").is_file()
          print("Prototype structure OK")
          PY
      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check lab.js
          node --test tests/lab.test.cjs
      - name: Verify Docker build
        run: docker build -t vila-viva:test .
      - name: Verify files inside deployment image
        run: |
          docker run -d --name vila-viva-ci -p 127.0.0.1:18761:80 vila-viva:test
          trap 'docker rm -f vila-viva-ci >/dev/null 2>&1 || true' EXIT
          docker exec vila-viva-ci test -s /usr/share/nginx/html/index.html
          docker exec vila-viva-ci test -s /usr/share/nginx/html/app.js
          docker exec vila-viva-ci test -s /usr/share/nginx/html/lab.js
          docker exec vila-viva-ci mkdir -p /usr/share/nginx/html/tests
          docker cp tests/browser-smoke.html vila-viva-ci:/usr/share/nginx/html/tests/browser-smoke.html
          for i in 1 2 3 4 5; do
            curl -fsS http://127.0.0.1:18761/lab.js >/dev/null && break
            sleep 1
          done
          google-chrome --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=6000 --dump-dom http://127.0.0.1:18761/tests/browser-smoke.html > /tmp/vila-viva-image-browser.html 2>/tmp/vila-viva-image-chrome.log
          if ! grep -q 'id="smoke-result" data-status="pass"' /tmp/vila-viva-image-browser.html; then
            grep -A4 'id="smoke-result"' /tmp/vila-viva-image-browser.html | head -8 || true
            tail -20 /tmp/vila-viva-image-chrome.log || true
            exit 1
          fi
          echo "Production image browser smoke passed"
  publish:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select immutable tag
        id: meta
        run: echo "tag=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/uillaneduardo/vila-viva:${{ steps.meta.outputs.tag }}
            ghcr.io/uillaneduardo/vila-viva:main
  deploy_homelab2:
    needs: [verify, publish]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, vila-viva-svr2]
    permissions:
      contents: read
      packages: read
    concurrency:
      group: vila-viva-homelab2
      cancel-in-progress: false
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check validated commit remains on main
        id: latest
        uses: actions/github-script@v7
        with:
          script: |
            const branch = await github.rest.repos.getBranch({
              owner: context.repo.owner, repo: context.repo.repo, branch: 'main'
            });
            core.setOutput('current', String(branch.data.commit.sha === context.sha));
      - name: Deploy using engineering standard
        if: steps.latest.outputs.current == 'true'
        uses: ./.github/actions/ghcr-compose-deploy
        with:
          app-dir: /home/uillan/homelab2/apps/vila-viva
          compose-source: compose.yml
          compose-target: .deploy/compose.yml
          validated-sha: ${{ github.sha }}
          image-tag: ${{ needs.publish.outputs.image_tag }}
          registry-user: ${{ github.actor }}
          registry-token: ${{ secrets.GITHUB_TOKEN }}
          health-url: http://127.0.0.1:8481/healthz
          env-file: ''
          services: web
          release-file: .release.svr2.env
