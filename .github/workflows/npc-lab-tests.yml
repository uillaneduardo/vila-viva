name: NPC Lab Tests
on:
  pull_request:
    paths:
      - 'lab.js'
      - 'app.js'
      - 'index.html'
      - 'tests/**'
      - '.github/workflows/npc-lab-tests.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check lab.js
          node --check app.js
      - name: NPC simulation unit tests
        run: node --test tests/lab.test.cjs
