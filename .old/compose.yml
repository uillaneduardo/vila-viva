services:
  api:
    image: ghcr.io/uillaneduardo/vila-viva:${IMAGE_TAG:-main}-engine
    restart: unless-stopped
    init: true
    environment:
      DATA_DIR: /data
      PORT: "3000"
    volumes:
      - simulation-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
  web:
    image: ghcr.io/uillaneduardo/vila-viva:${IMAGE_TAG:-main}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8481:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
volumes:
  simulation-data:
