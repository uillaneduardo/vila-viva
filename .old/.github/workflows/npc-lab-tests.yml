name: NPC Lab Tests
on:
  pull_request:
    paths:
      - 'lab.js'
      - 'app.js'
      - 'index.html'
      - 'tests/**'
      - '.github/workflows/npc-lab-tests.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check lab.js
          node --check app.js
      - name: NPC simulation unit tests
        run: node --test tests/lab.test.cjs
      - name: Browser smoke test (headless Chrome)
        run: |
          command -v google-chrome
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/vila-viva-http.log 2>&1 &
          trap 'kill $!' EXIT
          sleep 2
          google-chrome --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=5000 --dump-dom http://127.0.0.1:8765/tests/browser-smoke.html >/tmp/vila-viva-browser.html 2>/tmp/vila-viva-chrome.log
          grep -q 'id="smoke-result" data-status="pass"' /tmp/vila-viva-browser.html || {
            cat /tmp/vila-viva-browser.html | grep -A5 'smoke-result' | head -12 || true
            tail -30 /tmp/vila-viva-chrome.log || true
            exit 1
          }
          echo "Interactive browser smoke passed"
