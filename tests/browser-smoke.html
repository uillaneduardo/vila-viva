<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Vila Viva — teste de navegador</title></head>
<body><h1>Smoke test do Laboratório Vila Viva</h1><p id="smoke-result" data-status="running">Executando...</p><pre id="smoke-details"></pre>
<iframe id="game" src="../index.html" title="Jogo" style="width:1100px;height:850px;border:1px solid #bbb"></iframe>
<script>
const result=document.querySelector("#smoke-result"),details=document.querySelector("#smoke-details");
let errors=[];const check=(condition,label)=>{if(!condition)errors.push(label);};
const iframe=document.querySelector("#game");
iframe.addEventListener("load",()=>{
  setTimeout(()=>{
    try{
      const w=iframe.contentWindow,d=iframe.contentDocument;
      check(!!w.VilaLab,"API do laboratório deve estar carregada");
      check(!!d.querySelector("#map"),"Canvas deve existir");
      check(!!d.querySelector("#lab-panel"),"Painel do laboratório deve existir");
      check(d.querySelectorAll("[data-lab-npc]").length===6,"Seis NPCs devem estar disponíveis para inspeção");
      const first=d.querySelector('[data-lab-npc="collector"]');
      if(first){first.click();check(d.querySelector("#lab-inspection").textContent.includes("Borin"),"Clique no NPC deve abrir ficha de Borin");}
      const scenario=d.querySelector("#lab-scenario");scenario.value="forest";d.querySelector("#lab-apply").click();
      check(d.querySelector("#lab-history").textContent.includes("forest"),"Cenário aplicado deve aparecer no histórico");
      check(d.querySelector("#lab-summary").textContent.includes("NPCs"),"Estatísticas globais visíveis");
      d.querySelector("#lab-zoom-in").click();
      check(d.querySelector("#map").style.width!=="","Controle de zoom funcional");
      check(!!w.VilaGodView,"God View deve estar disponível");
      check(!!d.querySelector("#god-inspector"),"Painel de inspeção contextual deve existir");
      check(!!d.querySelector("#god-tools"),"Ferramentas de intervenção devem existir");
      check(!!d.querySelector("#god-dock"),"Indicadores inferiores devem existir");
      w.VilaGodView?.select("build");
      check(d.querySelector("#god-inspector-content").textContent.includes("Materiais necessários"),"Inspeção da obra exibe requisitos");
      w.VilaGodView?.select("depot");
      check(d.querySelector("#god-inspector-content").textContent.includes("Capacidade ocupada"),"Inspeção do depósito exibe ocupação");
      w.VilaGodView?.select("npc","collector");
      check(d.querySelector("#god-inspector-content").textContent.includes("Borin"),"Inspeção do NPC exibe morador");
      d.querySelector("#god-worlds").click();
      check(!d.querySelector("#god-modal").hidden,"Gerenciador de mundos abre");
      d.querySelector("#god-close-worlds").click();
      check(d.querySelector("#god-modal").hidden,"Gerenciador de mundos fecha");
      d.querySelector('[data-god-tool="source"]').click();
      check(!!d.querySelector("#god-source-type"),"Fonte de recursos disponível nas ferramentas");
      d.querySelector('[data-god-tool="observe"]').click();

      // Viewport regression: controls and inspector must not push the simulation off-screen.
      const viewport=iframe.getBoundingClientRect(),frameHeight=iframe.clientHeight;
      const mapRegion=d.querySelector(".mapwrap"),dock=d.querySelector("#god-dock"),side=d.querySelector(".side");
      check(dock.getBoundingClientRect().bottom<=frameHeight+3,"Desktop: rodapé do simulador deve caber na altura do navegador");
      check(mapRegion.getBoundingClientRect().height>=200,"Desktop: mapa deve permanecer utilizável");
      check(side.getBoundingClientRect().bottom<=frameHeight+3,"Desktop: painel lateral não ultrapassa a tela");
      check(d.documentElement.scrollWidth<=d.documentElement.clientWidth+3,"Desktop: não deve haver overflow horizontal");
      check(!!d.querySelector("#god-zoom-in")&&!!d.querySelector("#god-map-center"),"Controles de zoom e centralização visíveis");
      d.querySelector("#god-zoom-in").click();
      check(parseFloat(d.querySelector("#map").style.width)>100,"Controle de aumentar zoom operacional");
      d.querySelector("#god-map-center").click();
      check(d.querySelector("#map").style.width==="100%","Centralizar retorna zoom para ajuste à tela");
      iframe.style.width="390px";iframe.style.height="740px";
      check(d.documentElement.scrollWidth<=d.documentElement.clientWidth+3,"Mobile: sem corte horizontal da página");
      check(mapRegion.getBoundingClientRect().height>=250,"Mobile: mapa não desaparece");
      check(d.querySelector("#god-worlds").getBoundingClientRect().right<=d.documentElement.clientWidth+3,"Mobile: menu de mundos dentro da largura");
      iframe.style.width="1100px";iframe.style.height="850px";
      d.querySelector("#pause").click();
      check(d.querySelector("#lab-inspection").textContent.toLowerCase().includes("decis"),"Decisões consultáveis");
      result.dataset.status=errors.length?"fail":"pass";
      result.textContent=errors.length?"FALHOU ("+errors.length+")":"PASSOU — seleção, inspeção, eventos e controles";
      details.textContent=errors.join("\n");
    }catch(e){errors.push(e.stack||String(e));result.dataset.status="fail";result.textContent="FALHOU — exceção";details.textContent=errors.join("\n");}
  },850);
});
</script></body></html>
